name: Feature request
description: Suggest a new bot behaviour, command or website feature
title: "[Feature] <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: English or German is fine (Deutsch ist auch okay).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Bot raid tactics
        - Bot rotations / class behaviour
        - Bot commands
        - Gear, loot, consumables
        - Core / server
        - Website
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: e.g. In 10-man raids I have to give every paladin its blessing by hand.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your idea
      description: How should it work? Commands, examples, references to guides are welcome.
    validations:
      required: true
