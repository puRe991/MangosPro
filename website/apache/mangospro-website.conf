# MangosPro Website – Apache 2.4 VirtualHost (Beispiel)
#
#   sudo cp website/apache/mangospro-website.conf /etc/apache2/sites-available/
#   sudo a2enmod rewrite headers expires deflate
#   sudo a2ensite mangospro-website && sudo systemctl reload apache2
#
# Pfade unten anpassen: /var/www/mangospro = Kopie des Ordners "website" aus dem Repo.
# Nur public/ ist öffentlich, app/ (Konfiguration mit DB-Passwörtern) liegt außerhalb des DocumentRoot.

<VirtualHost *:80>
    ServerName wow.example.de
    # ServerAlias www.wow.example.de

    DocumentRoot /var/www/mangospro/public

    <Directory /var/www/mangospro/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/mangospro/app>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/mangospro-error.log
    CustomLog ${APACHE_LOG_DIR}/mangospro-access.log combined

    # Nach dem Einrichten von HTTPS (z. B. "sudo certbot --apache -d wow.example.de")
    # alle HTTP-Anfragen auf HTTPS umleiten:
    # RewriteEngine On
    # RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# Variante ohne .htaccess (AllowOverride None, etwas schneller):
# <Directory /var/www/mangospro/public>
#     Options -Indexes
#     AllowOverride None
#     Require all granted
#     FallbackResource /index.php
# </Directory>
