      <stop offset=".55" stop-color="#2a1236"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="72%" cy="30%" r="45%">
      <stop offset="0" stop-color="#7b3fb8" stop-opacity=".55"/>
